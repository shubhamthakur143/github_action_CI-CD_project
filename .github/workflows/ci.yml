name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # 1. TEST
  # ==========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Run lint
        run: |
          flake8 .


  # ==========================================
  # 2. BUILD + SECURITY SCAN + PUSH
  # ==========================================
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-action-app:${{ github.sha }} .

      - name: List Docker images
        run: |
          docker images

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/github-action-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-action-app:${{ github.sha }}


  # ==========================================
  # 3. DEPLOY ON SELF-HOSTED RUNNER
  # ==========================================
  deploy:
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Pull new Docker image
        run: |
          docker pull \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-action-app:${{ github.sha }}

      - name: Stop old container
        run: |
          docker stop github-action-app || true
          docker rm github-action-app || true

      - name: Start new container
        run: |
          docker run -d \
            --name github-action-app \
            -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-action-app:${{ github.sha }}

      - name: Wait for application
        run: |
          sleep 5

      - name: Health check
        run: |
          curl -f http://localhost:5000

      - name: Deployment successful
        run: |
          echo "================================="
          echo "Deployment successful!"
          echo "================================="
